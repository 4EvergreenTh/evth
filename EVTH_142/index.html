<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Archive EVTH 142 — Restricted</title>
    <link rel="stylesheet" href="css.css">
  </head>
  <body>

    <!-- Entry screen -->
    <div id="entry">
      <div class="card">
        <div class="title">Restricted: EVTH Section 142 Archive Interface</div>
        <input id="seed" class="input" placeholder="Enter access token" autofocus />
        <div class="hint">This interface is read-only. Interaction will be logged.</div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button id="open" class="btn">Access</button>
        </div>
        <div id="entrymsg" class="hint"></div>
      </div>
    </div>

    <!-- Main app -->
    <div id="app" style="display:none">
      <div class="shell">
        <!-- Left sidebar -->
        <aside class="sidebar">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="font-weight:700">EVTH142 • ARCHIVE</div>
            <div class="badge">read-only</div>
          </div>
          <div class="cat">Media Types</div>
          <div id="list"></div>
        </aside>

        <!-- Center viewer -->
        <main class="viewer" id="viewer">
          <div class="header">
            <div style="font-weight:700" id="vtitle">Welcome</div>
            <div class="controls">
              <button class="btn" id="downloadBtn">Download</button>
            </div>
          </div>
          <div id="content">
            <div class="small" style="text-align:center">Select an item to preview.</div>
          </div>
        </main>

        <!-- Right sidebar -->
        <aside class="sidebar">
          <div style="font-weight:700; margin-bottom:10px;">Item Details</div>
          <div class="audit" id="details">
            <div class="small">Select an item to view metadata and file info.</div>
          </div>
        </aside>
      </div>
    </div>

    <div id="hiddenToken" style="position:fixed; bottom:5px; right:5px; font-size:12px; color:transparent; user-select:text;">
      S15R16U20
    </div>

    <script src="js.js"></script>
  </body>
</html>

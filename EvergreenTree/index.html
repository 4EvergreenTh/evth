		<script>
window.addEventListener('load', () => {
  const urlParams = new URLSearchParams(window.location.search);

  // Only fade if ?fade=1
  if (urlParams.get('fade') === '1') {
    document.body.style.opacity = '0'; // start invisible

    setTimeout(() => {
      document.body.style.opacity = '1'; // fade in
    }, 500); // delay before fade
  } else {
    // Ensure visible if no ?fade=1
    document.body.style.opacity = '1';
  }
});
</script>

<script>
document.querySelectorAll('.channel').forEach(channel => {
  channel.addEventListener('click', e => {
    e.preventDefault();
    const link = channel.parentElement.href;

    const img = channel.querySelector('img');
    if (!img) return;

    const rect = img.getBoundingClientRect();

    // Create black background
    const blackBg = document.createElement('div');
    blackBg.style.position = 'fixed';
    blackBg.style.left = rect.left + 'px';
    blackBg.style.top = rect.top + 'px';
    blackBg.style.width = rect.width + 'px';
    blackBg.style.height = rect.height + 'px';
    blackBg.style.backgroundColor = 'black';
    blackBg.style.zIndex = 9998;
    blackBg.style.transition = 'all 0.5s ease';
    document.body.appendChild(blackBg);

    // Clone the image
    const clone = img.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.margin = 0;
    clone.style.zIndex = 9999;
    clone.style.transition = 'all 0.5s ease, opacity 0.5s ease';
    document.body.appendChild(clone);

    // Scale immediately
    requestAnimationFrame(() => {
      clone.style.left = '0';
      clone.style.top = '0';
      clone.style.width = '100%';
      clone.style.height = '100%';
      blackBg.style.left = '0';
      blackBg.style.top = '0';
      blackBg.style.width = '100%';
      blackBg.style.height = '100%';
    });

    // Delay fade
    setTimeout(() => {
      clone.style.opacity = 0;
    }, 200); // 200ms delay before fading

    // Redirect slightly after fade completes
    setTimeout(() => {
      window.location.href = link;
    }, 700); // 500ms fade + 200ms delay
  });
});


</script>




<audio id="clickSound" src="click.mp3" preload="auto"></audio>


<script>
const audio = document.getElementById('clickSound');
audio.volume = 0.3; // 50% volume

document.querySelectorAll('.channel').forEach(channel => {
  channel.addEventListener('click', () => {
    audio.currentTime = 0; // restart sound if clicked rapidly
    audio.play();
  });
});
</script>
